<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>AR/MR Музей — Meta Quest 3S</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#10131a;color:white}
#start{position:fixed;z-index:10;left:50%;top:18px;transform:translateX(-50%);
background:#fff;color:#111;padding:12px 18px;border-radius:14px;text-align:center;max-width:90%}
.small{font-size:13px;color:#444;margin-top:5px}
</style>
</head>
<body>
<div id="start">
  <b>AR/MR Музей для Meta Quest 3S</b><br>
  Нажмите кнопку VR внизу экрана. В очках разрешите доступ к пространству.
  <div class="small">Наведите луч контроллера на объект и нажмите курок.</div>
</div>

<a-scene
  webxr="optionalFeatures: hit-test,local-floor,hand-tracking,layers; overlayElement:#start"
  renderer="colorManagement:true; physicallyCorrectLights:true"
  background="color: transparent">

  <a-assets>
    <a-mixin id="panel" geometry="primitive:box; width:1.25; height:.72; depth:.08"
             material="roughness:.65; metalness:.05"></a-mixin>
  </a-assets>

  <a-entity light="type:ambient; intensity:1.2"></a-entity>
  <a-entity light="type:directional; intensity:1.1" position="1 3 2"></a-entity>

  <!-- Четыре музейных объекта -->
  <a-entity id="history" class="clickable" position="-1.15 1.35 -2.6">
    <a-box width=".75" height="1" depth=".5" color="#B68B5A"></a-box>
    <a-text value="ИСТОРИЯ" align="center" width="2.5" position="0 .75 0"></a-text>
  </a-entity>

  <a-entity id="culture" class="clickable" position="-.38 1.2 -2.25">
    <a-cone radius-bottom=".55" radius-top=".08" height=".8" color="#D8B36A"></a-cone>
    <a-text value="КУЛЬТУРА" align="center" width="2.5" position="0 .75 0"></a-text>
  </a-entity>

  <a-entity id="nature" class="clickable" position=".48 1.15 -2.25">
    <a-sphere radius=".42" color="#5E9C76"></a-sphere>
    <a-text value="ПРИРОДА" align="center" width="2.5" position="0 .7 0"></a-text>
  </a-entity>

  <a-entity id="hall" class="clickable" position="1.2 1.3 -2.6">
    <a-cylinder radius=".42" height=".9" color="#7C8FC7"></a-cylinder>
    <a-text value="ХОЛЛ" align="center" width="2.5" position="0 .75 0"></a-text>
  </a-entity>

  <!-- Информационная панель -->
  <a-entity id="info" visible="false" position="0 1.65 -1.65">
    <a-entity mixin="panel" material="color:#172033; opacity:.94; transparent:true"></a-entity>
    <a-text id="title" value="" align="center" width="2.2" position="0 .2 .05"></a-text>
    <a-text id="desc" value="" align="center" width="1.8" wrap-count="34"
            position="0 -.05 .05"></a-text>
  </a-entity>

  <!-- Наведение взглядом на компьютере/телефоне -->
  <a-camera position="0 1.6 0">
    <a-cursor raycaster="objects:.clickable" fuse="false"></a-cursor>
  </a-camera>

  <!-- Контроллеры Quest -->
  <a-entity laser-controls="hand: left" raycaster="objects:.clickable"></a-entity>
  <a-entity laser-controls="hand: right" raycaster="objects:.clickable"></a-entity>
</a-scene>

<script>
const data={
 history:["История","Исторические экспонаты Казахстана. Здесь можно разместить 3D-модели, фотографии и рассказ."],
 culture:["Культура","Традиции, национальная одежда, музыка, юрта и предметы быта."],
 nature:["Природа","Животные, растения и природные достопримечательности Казахстана."],
 hall:["Холл","Главная зона виртуального музея. Выберите интересующий раздел."]
};
document.querySelectorAll(".clickable").forEach(el=>{
 el.addEventListener("click",()=>{
   const d=data[el.id];
   document.querySelector("#title").setAttribute("value",d[0]);
   document.querySelector("#desc").setAttribute("value",d[1]);
   document.querySelector("#info").setAttribute("visible",true);
 });
});
</script>
</body>
</html>
